
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esraa Zaki Fawzy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f7ff;
        }

        .header {
            background-color: #0171f9;
            padding: 15px 8%;
            border-radius: 0 0 25px 25px;
        }

        .logo {
            width: 60px;
            height: auto;
        }

        .about {
            text-align: center;
            margin: 100px auto;
            padding: 30px;
            max-width: 650px;
        }

        .about h1 {
            color: #0171f9;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .about h2 {
            color: #222;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .about p {
            color: #555;
            font-size: 18px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .about {
                margin: 60px auto;
                padding: 20px;
            }

            .about h1 {
                font-size: 32px;
            }

            .about h2 {
                font-size: 23px;
            }

            .about p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <img class="logo"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtSqbWkEQ8w0I3Eiye0FQTZuPTXR0KpE1SFbWe9L2kmvGKt-j4QqKkmuAg&s=10"
            alt="Logo">
    </div>

    <div class="about">
        <h1>Hello!</h1>

        <h2>My name is Esraa Zaki Fawzy</h2>

        <p>
            I am a student at New Cairo Technological University.
            I like technology and learning new things.
            I hope to have a successful future.
        </p>
    </div>

</body>

</html>
